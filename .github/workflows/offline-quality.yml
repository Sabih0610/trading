name: Windows offline quality and safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    # Owner must verify Actions eligibility and authorize activation. Private repos stay closed.
    if: vars.OFFLINE_CI_APPROVED_FREE_RUNNER == 'true' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12.11'
          enable-cache: false
      - name: Offline checks and owned acceptance
        run: ./scripts/check-offline.ps1
