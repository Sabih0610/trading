[project]
name = "trading-bot"
version = "0.1.0"
description = "Shariah-compliant, intraday, AI-assisted spot trading research system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arch==8.0.0",
    "defusedxml==0.7.1",
    "hmmlearn==0.3.3",
    "httpx==0.28.1",
    "lightgbm==4.7.0",
    "mlflow==3.17.2",
    "polars==2.0.0",
    "psutil==7.2.2",
    "pydantic-settings==2.16.1",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
    "typer==0.27.3",
    "tzdata==2026.5",
]

[project.scripts]
tb = "tb.cli:app"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tb"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
exclude = [
    ".agents",
    ".cache",
    ".claude",
    ".venv",
    "data",
    "mlruns",
    "trading-bot-dev-kit",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["tb"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib -m 'not live'"
testpaths = ["tests"]
markers = [
    "live: requires network access or external credentials and is skipped by default workflows",
]

[tool.coverage.run]
branch = true
source = ["tb"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "hypothesis==6.170.5",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "types-psutil==7.2.2.20260906",
    "types-pyyaml==6.0.12.20260906",
    "types-defusedxml==0.7.0.20260504",
]
